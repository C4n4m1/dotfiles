# Example Theme Configuration
# This file demonstrates all available theme configuration options for Vicinae.
# You don't need to define all of these - only override what you want to customize.
# Undefined colors will be automatically derived from core colors or inherited from base themes.
#
# Where a color name is expected, you can use the following hex formats:
# #RGB
# #RRGGBB
# #AARRGGBB (with alpha)
# 'transparent' (no color)
# <color_ref> (e.g 'colors.accents.red'): references this theme's definition if available, the parent's otherwise
#
# Where a color is expected, you can either use a simple string for the color name or the following table syntax:
# [colors.core]
# accent = "accents.color.red"
# OR:
# accent = { name = "accents.color.red", opacity = 0.5 }
# OR:
# accent = { name = "accents.color.red", lighter = 100 }
# OR:
# accent = { name = "accents.color.red", darker = 150 }

[meta]
name = "oldworld"                         # Display name shown in theme picker
version = 1
description = "Canami custom theme"   # Description shown in theme picker
variant = "dark"                              # Theme variant: "dark" or "light". Every dark theme inherits from vicinae-dark and every light theme from vicinae-light.
# inherits = "vicinae-dark"                     # Optional: inherit from another theme (e.g., "vicinae-dark")
icon = "/home/credo/.config/vicinae/themes/mob.png"                 # Optional: path to theme icon (relative to the theme directory it is placed in if not an absolute path)

# ============================================================================
# Core Colors
# ============================================================================
# These are the most important colors that define your theme's overall look.
# Most other colors can be automatically derived from these if not specified.

[colors.core]
accent = "#92A2D5"              # Primary accent color (used for input borders, text selection background...)
accent_foreground = "#ffffff"   # Text color on accent-colored backgrounds
background = "#131314"          # Main application background
foreground = "#C9C7CD"          # Primary text color
secondary_background = "#181819" # Background for surfaces elevated above main (popups, tooltips, panels)
border = "#252528"              # Default border color throughout the UI

# ============================================================================
# Window-Specific Colors
# ============================================================================
# Override border colors for specific window types

[colors.main_window]
border = { name = "#505050", opacity = 0.5 }

[colors.settings_window]
border = "#252528"

# ============================================================================
# Accent Colors
# ============================================================================
# Your color palette, central to your theme's identity

[colors.accents]
blue = "#85B5BA"
green = "#90B99F"
magenta = "#E29ECA"
orange = "#F5A191"
purple = "#ACA1CF"
red = "#EA83A5"
yellow = "#E6B99D"
cyan = "#92A2D5"

# ============================================================================
# Text Colors
# ============================================================================
# Colors for various text states and meanings

[colors.text]
default = "#F9F7FD"            # Usually same as core.foreground
muted = "#A9A7AD"              # Secondary text: hints, less important info
danger = "#EA83A5"              # Errors or warnings
success = "#90B99F"             # Success or positive states
placeholder = "#606060"         # input placeholder, search placeholder...
selection = { background = "#92A2D5", foreground = "#ffffff" }

[colors.text.links]
default = "#92A2D5"
visited = "#E29ECA"

# ============================================================================
# Input Fields
# ============================================================================
# Colors for text inputs, search boxes, etc.

[colors.input]
border = "#252528"
border_focus = "#92A2D5"
border_error = "#EA83A5"

# ============================================================================
# Buttons
# ============================================================================
# Colors for button states

[colors.button.primary]
background = "#252528"
foreground = "#C9C7CD"
hover = { background = "#bb252528" }
focus = { outline = "colors.core.accent" }

# ============================================================================
# Lists
# ============================================================================
# Colors for list items (horizontal list views)

[colors.list.item.hover]
background = "#252528"
foreground = "#C9C7CD"

[colors.list.item.selection]
background = "#252528"          # Selected item on main background
foreground = "#C9C7CD"
secondary_background = "#252528" # Selected item on secondary surfaces (popups, panels)
                                 # Light themes: lighter than primary selection
                                 # Dark themes: lighter/brighter than primary selection
secondary_foreground = "#C9C7CD"

# ============================================================================
# Grid Items
# ============================================================================
# Colors for grid-based layouts (icon grids, tiles, etc.)

[colors.grid.item]
# background = "#252528"
hover = { outline = "#C9C7CD" }
selection = { outline = "#C9C7CD" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = "#131314"

# ============================================================================
# Loading Indicators
# ============================================================================

[colors.loading]
bar = "#C9C7CD"     # shown right below the search bar when something is loading
spinner = "#C9C7CD" # used by dynamic toasts
